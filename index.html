
<div class="quote-slider" id="quoteSlider">
  <span class="quote-label">DAILY INSPIRATION</span>

  <p class="quote-text" id="quoteText"></p>
  <span class="quote-author" id="quoteAuthor"></span>

  <div class="quote-dots" id="quoteDots"></div>
</div>

<style>
.quote-slider {
  width: 100%;
  padding: 12px 16px;
  box-sizing: border-box;
  text-align: center;
  font-family: inherit;
}

.quote-label {
  display: block;
  color: #94a3b8;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  margin-bottom: 10px;
}

.quote-text {
  color: inherit;
  font-size: clamp(14px, 2vw, 18px);
  font-weight: 600;
  line-height: 1.7;
  margin: 0 auto 6px;
  transition: opacity .4s ease, transform .4s ease;
}

.quote-author {
  display: block;
  color: #94a3b8;
  font-size: 12px;
  transition: opacity .4s ease;
}

.quote-dots {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin-top: 16px;
}

.quote-dot {
  width: 6px;
  height: 6px;
  padding: 0;
  border: none;
  border-radius: 99px;
  background: #cbd5e1;
  cursor: pointer;
  transition: width .3s ease, background .3s ease;
}

.quote-dot.active {
  width: 20px;
  background: #64748b;
}

.quote-slider.fade-out .quote-text,
.quote-slider.fade-out .quote-author {
  opacity: 0;
  transform: translateY(5px);
}

@media (prefers-reduced-motion: reduce) {
  .quote-text, .quote-author, .quote-dot {
    transition: none;
  }
}
</style>

<script>
(() => {
  const slider = document.getElementById("quoteSlider");
  if (!slider || slider.dataset.initialized) return;
  slider.dataset.initialized = "true";

  const text = slider.querySelector("#quoteText");
  const author = slider.querySelector("#quoteAuthor");
  const dots = slider.querySelector("#quoteDots");

  const quotes = [
    {
      text: "It always seems impossible until it's done.",
      author: "Nelson Mandela"
    },
    {
      text: "Có công mài sắt, có ngày nên kim.",
      author: "Tục ngữ Việt Nam"
    },
    {
      text: "The future depends on what you do today.",
      author: "Mahatma Gandhi"
    },
    {
      text: "Thất bại là mẹ thành công.",
      author: "Tục ngữ Việt Nam"
    },
    {
      text: "Believe you can and you're halfway there.",
      author: "Theodore Roosevelt"
    },
    {
      text: "Học, học nữa, học mãi.",
      author: "Câu nói thường được gán cho Lenin"
    },
    {
      text: "The secret of getting ahead is getting started.",
      author: "Mark Twain"
    },
    {
      text: "Đường đi khó không khó vì ngăn sông cách núi, mà khó vì lòng người ngại núi e sông.",
      author: "Nguyễn Bá Học"
    },
    {
      text: "Well done is better than well said.",
      author: "Benjamin Franklin"
    },
    {
      text: "Không có áp lực, không có kim cương.",
      author: "Danh ngôn phổ biến"
    },
    {
      text: "Stay hungry, stay foolish.",
      author: "Steve Jobs"
    },
    {
      text: "Có chí thì nên.",
      author: "Tục ngữ Việt Nam"
    }
  ];

  let index = 0;
  let timer;

  // Tạo thanh chỉ báo, bấm vào để chuyển câu
  quotes.forEach((quote, i) => {
    const dot = document.createElement("button");
    dot.type = "button";
    dot.className = "quote-dot";
    dot.setAttribute("aria-label", "Xem câu nói " + (i + 1));

    dot.addEventListener("click", () => {
      showQuote(i);
      restartTimer();
    });

    dots.appendChild(dot);
  });

  function showQuote(nextIndex, animate = true) {
    index = nextIndex;

    const update = () => {
      text.textContent = "“" + quotes[index].text + "”";
      author.textContent = "— " + quotes[index].author;

      [...dots.children].forEach((dot, i) => {
        dot.classList.toggle("active", i === index);
        dot.setAttribute("aria-current", i === index ? "true" : "false");
      });

      slider.classList.remove("fade-out");
    };

    if (animate) {
      slider.classList.add("fade-out");
      setTimeout(update, 400);
    } else {
      update();
    }
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
      showQuote((index + 1) % quotes.length);
    }, 5000);
  }

  showQuote(0, false);
  restartTimer();
})();
</script>
